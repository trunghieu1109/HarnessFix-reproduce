# Gemini served by an OpenAI-compatible gateway.
# openai/ selects the HTTP protocol; the backend model remains Gemini.
name: gemini-api
model: openai/ag/gemini-3.1-pro-low
api_base: GEMINI_BASE_URL
api_key_env: GEMINI_API_KEY

# Token budgets; adjust to your chosen model's limits.
max_input_tokens: 250000
max_output_tokens: 8192
temperature: 0.2
# Gemini 3.1 Pro supports low thinking, but cannot disable it completely.
reasoning_effort: low
